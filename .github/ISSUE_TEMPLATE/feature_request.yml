name: Feature request
description: A new phase, command, backend, agent or CLI capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core (phases/commands/conventions), persistence backend, agent registry, CLI, docs]
    validations:
      required: true
