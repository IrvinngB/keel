schema: spec-driven
artifact_store: files
stack: JavaScript (Node.js >=18, zero-dependency CLI, no framework, no TypeScript)
context: |
  Keel (npm "keel-sdd"): spec-driven-development toolkit for AI coding agents.
  Zero runtime dependencies. Edit core/ (tool-agnostic markdown contracts); never edit
  adapters/ (generated by build/generate.js via `node bin/sdd build`). Commit regenerated
  adapters as a separate "build: regenerate adapters" commit. Conventional Commits.
  Keel's own pipeline only (artifacts in keel/, files backend), run with the released Keel.
  A bug fix in bin/sdd needs a test that fails without it.
strict_tdd: true
security_review: false
testing:
  full: npm test
  focused: node --test test/<file>.test.js
  lint: none
  typecheck: none
checks:
  - node bin/sdd build
  - git status --porcelain adapters/   # must be empty after committing the rebuild
experts: []
